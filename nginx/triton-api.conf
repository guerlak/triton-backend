# Configuração Nginx para Triton Backend API
# Caminho no servidor Ubuntu: /etc/nginx/sites-available/triton-api
# Ativar com: sudo ln -s /etc/nginx/sites-available/triton-api /etc/nginx/sites-enabled/
# Certificado SSL: sudo certbot --nginx -d seu-dominio.com

server {
    listen 80;
    server_name seu-dominio.com; # Substitua pelo seu domínio/subdomínio ou IP do Droplet

    # Limite máximo de upload (para imagens de eventos / hero)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}

