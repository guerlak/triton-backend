services:
  postgres:
    image: postgres:16-alpine
    container_name: triton-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: triton_db
    ports:
      - "5432:5432"
    volumes:
      - triton_pgdata:/var/lib/postgresql/data

volumes:
  triton_pgdata:

