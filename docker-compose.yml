services:
  postgres:
    image: postgres:16-alpine
    container_name: triton-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-triton_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - triton_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-triton_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: triton-api
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-triton_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  triton_pgdata:
